<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <!-- Border: solid gray rect underneath -->
  <rect x="0" y="0" width="240" height="240" rx="32" fill="#767676"/>
  <!-- Inner white rect inset by 2px creates a crisp, uniform border -->
  <rect x="2" y="2" width="236" height="236" rx="30" fill="#ffffff"/>
  <!-- Sun: black disc with twelve rays, top-left corner (opposite Luna's moon) -->
  <circle cx="60" cy="60" r="20" fill="#000000" stroke="#767676" stroke-width="2"/>
  <g stroke="#000000" stroke-width="5" stroke-linecap="round">
    <line x1="90.0" y1="60.0" x2="100.0" y2="60.0"/>
    <line x1="86.0" y1="75.0" x2="94.6" y2="80.0"/>
    <line x1="75.0" y1="86.0" x2="80.0" y2="94.6"/>
    <line x1="60.0" y1="90.0" x2="60.0" y2="100.0"/>
    <line x1="45.0" y1="86.0" x2="40.0" y2="94.6"/>
    <line x1="34.0" y1="75.0" x2="25.4" y2="80.0"/>
    <line x1="30.0" y1="60.0" x2="20.0" y2="60.0"/>
    <line x1="34.0" y1="45.0" x2="25.4" y2="40.0"/>
    <line x1="45.0" y1="34.0" x2="40.0" y2="25.4"/>
    <line x1="60.0" y1="30.0" x2="60.0" y2="20.0"/>
    <line x1="75.0" y1="34.0" x2="80.0" y2="25.4"/>
    <line x1="86.0" y1="45.0" x2="94.6" y2="40.0"/>
  </g>
</svg>
