<svg xmlns="http://www.w3.org/2000/svg" width="512" height="620" viewBox="0 0 512 620" fill="none">
  <!-- =========================
       ICON
       ========================= -->
  <!-- 240px design scaled 2x, centered on the 512px canvas -->
  <g transform="translate(16, 0) scale(2)">
    <!-- Border: solid gray rect underneath -->
    <rect x="0" y="0" width="240" height="240" rx="32" fill="#767676"/>
    <!-- Inner white rect inset by 2px creates a crisp, uniform border -->
    <rect x="2" y="2" width="236" height="236" rx="30" fill="#ffffff"/>
    <!-- Black circle in the bottom-right corner, p-4 (16px) padding, with gray border -->
    <circle cx="200" cy="200" r="24" fill="#000000" stroke="#767676" stroke-width="2"/>
  </g>

  <!-- =========================
       WORDMARK
       ========================= -->

  <text
    x="256"
    y="540"
    text-anchor="middle"
    fill="#000000"
    font-family="FreeMono, monospace"
    font-size="44"
    letter-spacing="0.5">
    LibreServ
  </text>
</svg>